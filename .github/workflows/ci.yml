name: CI

on:
  push:
    branches: [ main, master, linkme-main ]
  pull_request:

jobs:
  protocol-validation:
    name: Protocol Schema & Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate protocol JSON files
        run: |
          python3 -m json.tool protocol/schema.json > /dev/null
          python3 -m json.tool protocol/test_vectors.json > /dev/null

  macos-build-and-test:
    name: macOS (MacBridge Swift 6)
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 & Run Swift Test
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          swift --version
          swift test

  android-build-and-test:
    name: Android (AndroidBridge Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Preinstalled Android SDK Licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests & Assemble Debug APKs
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
          MERGED_APP_MANIFEST="$(find app/build/intermediates/merged_manifests -name 'AndroidManifest.xml' | head -n 1)"
          test -n "$MERGED_APP_MANIFEST"
          for perm in \
            android.permission.BIND_ACCESSIBILITY_SERVICE \
            android.permission.BIND_DEVICE_ADMIN \
            android.permission.REQUEST_INSTALL_PACKAGES \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$perm" "$MERGED_APP_MANIFEST" app/src/main/AndroidManifest.xml; then
              echo "ERROR: Play Protect restricted permission $perm found in :app manifest!"
              exit 1
            fi
          done
          echo "Verified :app manifest & merged manifest free of Play Protect high-risk permissions."
