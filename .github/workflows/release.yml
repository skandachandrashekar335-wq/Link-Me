name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      android_only:
        description: "Rebuild & replace ONLY Android APKs + SHA256SUMS.txt without touching DMG"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS DMG
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.android_only }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 & Build MacBridge.app
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          cd macos
          swift build -c release
          BIN_PATH="$(swift build -c release --show-bin-path)/MacBridge"
          APP_DIR="../dist/MacBridge.app"
          rm -rf ../dist
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$BIN_PATH" "$APP_DIR/Contents/MacOS/MacBridge"
          cp Resources/Info.plist "$APP_DIR/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          printf 'APPL????' > "$APP_DIR/Contents/PkgInfo"
          codesign --force --deep --entitlements Resources/MacBridge.entitlements --sign - "$APP_DIR"
          codesign -d --entitlements - "$APP_DIR" || true

      - name: Package DMG & Verify Non-Empty
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          ln -s /Applications dist/Applications
          cp macos/Scripts/Install-on-Android.command dist/Install-on-Android.command
          chmod +x dist/Install-on-Android.command
          hdiutil create -volname "MacBridge" \
            -srcfolder dist/ \
            -ov -format UDZO \
            "MacBridge-${TAG_NAME}.dmg"
          test -s "MacBridge-${TAG_NAME}.dmg"
          shasum -a 256 "MacBridge-${TAG_NAME}.dmg" > SHA256SUMS.macos.txt
          ls -lh "MacBridge-${TAG_NAME}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            MacBridge-*.dmg
            SHA256SUMS.macos.txt

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Preinstalled Android SDK Licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Release APKs (Core + Optional Notify Add-on)
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :notify-addon:testDebugUnitTest :app:assembleRelease :notify-addon:assembleRelease --no-daemon
          MERGED_APP_MANIFEST="$(find app/build/intermediates/merged_manifests -path '*release*' -name 'AndroidManifest.xml' | head -n 1)"
          test -n "$MERGED_APP_MANIFEST"
          for perm in \
            android.permission.BIND_ACCESSIBILITY_SERVICE \
            android.permission.BIND_NOTIFICATION_LISTENER_SERVICE \
            android.permission.BIND_DEVICE_ADMIN \
            android.permission.REQUEST_INSTALL_PACKAGES \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$perm" "$MERGED_APP_MANIFEST" app/src/main/AndroidManifest.xml; then
              echo "ERROR: Play Protect restricted permission $perm found in :app release manifest!"
              exit 1
            fi
          done

      - name: Align & Sign Release APKs (v1/v2/v3 with shared release key)
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-out
          RAW_CORE_APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          RAW_ADDON_APK="$(find android/notify-addon/build/outputs/apk/release -name '*.apk' | head -n 1)"

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          KEYSTORE_PATH="/tmp/linkme-release.p12"
          KEYSTORE_TYPE="PKCS12"
          KEYSTORE_PASS="linkme-release-v2"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          else
            cp android/keystore/linkme-release.p12 "$KEYSTORE_PATH"
          fi

          sign_apk() {
            local raw_apk="$1"
            local out_name="$2"
            local aligned="/tmp/aligned-${out_name}"
            local out_path="release-out/${out_name}"

            "$ZIPALIGN" -p -f -v 4 "$raw_apk" "$aligned"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-type "$KEYSTORE_TYPE" \
              --ks-pass "pass:${KEYSTORE_PASS}" \
              --key-pass "pass:${KEYSTORE_PASS}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$out_path" \
              "$aligned"

            "$APKSIGNER" verify --verbose --print-certs "$out_path"
            "$ZIPALIGN" -c -v 4 "$out_path" | tail -n 5
            test -s "$out_path"
          }

          sign_apk "$RAW_CORE_APK" "AndroidBridge-${TAG_NAME}.apk"
          sign_apk "$RAW_ADDON_APK" "AndroidBridge-NotifyAddon-${TAG_NAME}.apk"

          "$AAPT2" dump xmltree "release-out/AndroidBridge-${TAG_NAME}.apk" --file AndroidManifest.xml > /tmp/core-apk-manifest.txt
          "$AAPT2" dump permissions "release-out/AndroidBridge-${TAG_NAME}.apk" > /tmp/core-apk-perms.txt
          "$AAPT2" dump permissions "release-out/AndroidBridge-NotifyAddon-${TAG_NAME}.apk" > /tmp/addon-apk-perms.txt
          echo "=== Core APK Permissions ==="
          cat /tmp/core-apk-perms.txt
          echo "=== NotifyAddon APK Permissions ==="
          cat /tmp/addon-apk-perms.txt
          for perm in \
            android.permission.BIND_ACCESSIBILITY_SERVICE \
            android.permission.BIND_NOTIFICATION_LISTENER_SERVICE \
            android.permission.BIND_DEVICE_ADMIN \
            android.permission.REQUEST_INSTALL_PACKAGES \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$perm" /tmp/core-apk-manifest.txt /tmp/core-apk-perms.txt; then
              echo "ERROR: Restricted permission $perm leaked into signed core APK!"
              exit 1
            fi
          done
          for perm in \
            android.permission.BIND_ACCESSIBILITY_SERVICE \
            android.permission.BIND_DEVICE_ADMIN \
            android.permission.REQUEST_INSTALL_PACKAGES \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$perm" /tmp/addon-apk-perms.txt; then
              echo "ERROR: Restricted permission $perm leaked into signed NotifyAddon APK!"
              exit 1
            fi
          done
          echo "Verified both signed APKs (Core + NotifyAddon) free of Accessibility/Admin/Alert/Install blocks."

          (cd release-out && sha256sum "AndroidBridge-${TAG_NAME}.apk" "AndroidBridge-NotifyAddon-${TAG_NAME}.apk" > SHA256SUMS.android.txt)
          ls -lh release-out/

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            release-out/AndroidBridge-*.apk
            release-out/SHA256SUMS.android.txt

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-dmg, build-android-apk]
    if: ${{ !cancelled() && needs.build-android-apk.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.android_only) || needs.build-macos-dmg.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets & SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-files
          cp release-artifacts/android-release/AndroidBridge-*.apk release-files/
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.android_only }}" = "true" ]; then
            gh release download "$TAG_NAME" --repo "${{ github.repository }}" --pattern "MacBridge-${TAG_NAME}.dmg" --dir /tmp/existing-dmg
            (cd /tmp/existing-dmg && sha256sum "MacBridge-${TAG_NAME}.dmg") > release-files/SHA256SUMS.macos.txt
            cat release-files/SHA256SUMS.macos.txt \
                release-artifacts/android-release/SHA256SUMS.android.txt > release-files/SHA256SUMS.txt
            gh release upload "$TAG_NAME" --repo "${{ github.repository }}" \
              release-files/AndroidBridge-*.apk \
              release-files/SHA256SUMS.txt \
              --clobber
          else
            cp release-artifacts/macos-release/MacBridge-*.dmg release-files/
            cat release-artifacts/macos-release/SHA256SUMS.macos.txt \
                release-artifacts/android-release/SHA256SUMS.android.txt > release-files/SHA256SUMS.txt
          fi
          ls -lh release-files/
          cat release-files/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.android_only }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-files/MacBridge-*.dmg
            release-files/AndroidBridge-*.apk
            release-files/SHA256SUMS.txt
          generate_release_notes: true
